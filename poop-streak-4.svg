<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <radialGradient id="bg-poop-d4" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bd7d4c"/>
      <stop offset="50%" stop-color="#925c34"/>
      <stop offset="100%" stop-color="#5a341b"/>
    </radialGradient>
    <linearGradient id="highlight-d4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#sticker-shadow)">
    <!-- Белая контурная обводка стикера (3 этажа) -->
    <path d="M150 55 
             C170 55, 185 65, 195 80 
             C220 75, 240 95, 245 120 
             C255 150, 245 190, 220 215 
             C195 235, 165 240, 150 240 
             C135 240, 105 235, 80 215 
             C55 190, 45 150, 55 120 
             C60 95, 80 75, 105 80 
             C115 65, 130 55, 150 55 Z" fill="#ffffff"/>
             
    <!-- Внутренняя серая обводка -->
    <path d="M150 59 
             C168 59, 182 68, 191 82 
             C215 77, 234 97, 239 120 
             C248 148, 238 184, 215 207 
             C192 227, 164 232, 150 232 
             C136 232, 108 227, 85 207 
             C62 184, 52 148, 61 120 
             C66 97, 85 77, 109 82 
             C118 68, 132 59, 150 59 Z" fill="#eaeaea"/>

    <!-- Нижний ярус (3 этаж) -->
    <path d="M150 145 
             C195 145, 230 165, 220 200 
             C210 225, 180 230, 150 230 
             C120 230, 90 225, 80 200 
             C70 165, 105 145, 150 145 Z" fill="url(#bg-poop-d4)"/>

    <!-- Средний ярус (2 этаж) -->
    <path d="M150 100 
             C185 100, 210 120, 200 155 
             C190 180, 165 185, 150 185 
             C135 185, 110 180, 100 155 
             C90 120, 115 100, 150 100 Z" fill="#a16b41"/>

    <!-- Верхний завиток (1 этаж) -->
    <path d="M150 65 
             C172 65, 185 80, 178 108 
             C170 130, 158 140, 150 140 
             C142 140, 130 130, 122 108 
             C115 80, 128 65, 150 65 Z" fill="#bd7d4c"/>

    <!-- Глянцевый блик сверху -->
    <path d="M150 65 C165 65, 178 75, 182 90 C165 80, 140 85, 125 100 C120 85, 132 68, 150 65 Z" fill="url(#highlight-d4)"/>

    <!-- Волшебные искры и сияние вокруг -->
    <path d="M220 70 Q220 82 232 82 Q220 82 220 94 Q220 82 208 82 Q220 82 220 70 Z" fill="#ffcc00"/>
    <path d="M75 195 Q75 203 83 203 Q75 203 75 211 Q75 203 67 203 Q75 203 75 195 Z" fill="#ffcc00"/>
    <circle cx="205" cy="180" r="3.5" fill="#ff9900"/>
    <circle cx="95" cy="75" r="3" fill="#ff9900"/>

    <!-- Лицо: День 4 (Глянцевый, аниме-глаза с искрами, сияющая улыбка) -->
    <!-- Глаза -->
    <ellipse cx="128" cy="144" rx="8" ry="10" fill="#1c0a02"/>
    <ellipse cx="172" cy="144" rx="8" ry="10" fill="#1c0a02"/>
    <ellipse cx="126" cy="141" rx="3" ry="4" fill="#ffffff"/>
    <ellipse cx="170" cy="141" rx="3" ry="4" fill="#ffffff"/>
    <circle cx="131" cy="150" r="1.5" fill="#ffffff"/>
    <circle cx="175" cy="150" r="1.5" fill="#ffffff"/>

    <!-- Приподнятые игривые брови -->
    <path d="M118 129 Q128 123 138 129" fill="none" stroke="#1c0a02" stroke-width="3" stroke-linecap="round"/>
    <path d="M182 129 Q172 123 162 129" fill="none" stroke="#1c0a02" stroke-width="3" stroke-linecap="round"/>

    <!-- Широкая счастливая улыбка -->
    <path d="M136 162 Q150 174 164 162" fill="none" stroke="#1c0a02" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Яркий румянец -->
    <ellipse cx="114" cy="154" rx="6" ry="3" fill="#ff5252" opacity="0.45"/>
    <ellipse cx="186" cy="154" rx="6" ry="3" fill="#ff5252" opacity="0.45"/>
  </g>
</svg>
