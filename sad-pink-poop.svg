<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Розовый градиент -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD1DC" />
      <stop offset="50%" stop-color="#FF99C2" />
      <stop offset="100%" stop-color="#FF69B4" />
    </linearGradient>
    <!-- Тень стикера -->
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#FF1493" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- Звездочки-блестки вокруг -->
    <path d="M 20 22 L 22 28 L 28 30 L 22 32 L 20 38 L 18 32 L 12 30 L 18 28 Z" fill="#FFF700" />
    <path d="M 80 32 L 81.5 36 L 85.5 37.5 L 81.5 39 L 80 43 L 78.5 39 L 74.5 37.5 L 78.5 36 Z" fill="#FFF700" />

    <!-- Белая обводка (эффект стикера) -->
    <path d="M 50 15 C 30 35, 25 45, 35 50 C 15 50, 10 65, 25 70 C 5 70, 10 90, 50 90 C 90 90, 95 70, 75 70 C 90 65, 85 50, 65 50 C 75 45, 70 35, 50 15 Z" fill="white" stroke="white" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- Основное тело -->
    <path d="M 50 15 C 30 35, 25 45, 35 50 C 15 50, 10 65, 25 70 C 5 70, 10 90, 50 90 C 90 90, 95 70, 75 70 C 90 65, 85 50, 65 50 C 75 45, 70 35, 50 15 Z" fill="url(#pinkGrad)"/>
    
    <!-- 3D блики -->
    <path d="M 33 46 C 24 47, 24 51, 30 53" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 28 65 C 18 67, 18 73, 24 76" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 20 83 C 12 86, 25 87, 45 87" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M 45 25 C 45 25, 48 29, 52 29" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- Румянец -->
  <ellipse cx="26" cy="72" rx="7" ry="4" fill="#FF1493" opacity="0.4" />
  <ellipse cx="74" cy="72" rx="7" ry="4" fill="#FF1493" opacity="0.4" />
  <circle cx="24" cy="71" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="76" cy="71" r="1.5" fill="white" opacity="0.8"/>

  <!-- Лицо: Глаза -->
  <circle cx="35" cy="63" r="6" fill="#633241" />
  <circle cx="65" cy="63" r="6" fill="#633241" />
  <circle cx="37" cy="61" r="2.5" fill="white" />
  <circle cx="67" cy="61" r="2.5" fill="white" />
  
  <!-- Грустные бровки -->
  <path d="M 29 57 Q 35 53 41 57" fill="none" stroke="#633241" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 59 57 Q 65 53 71 57" fill="none" stroke="#633241" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Грустный рот -->
  <path d="M 45 77 Q 50 72 55 77" fill="none" stroke="#633241" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Слеза -->
  <path d="M 33 70 Q 35 75 31 75 Q 27 75 27 70 Q 27 65 30 62 Q 33 65 33 70 Z" fill="#87CEFA" opacity="0.9"/>
</svg>
