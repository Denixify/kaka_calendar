<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <radialGradient id="bg-poop-d3" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ab6e41"/>
      <stop offset="50%" stop-color="#80502a"/>
      <stop offset="100%" stop-color="#523018"/>
    </radialGradient>
    <linearGradient id="highlight-d3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#sticker-shadow)">
    <!-- Белая контурная обводка стикера (3 этажа) -->
    <path d="M150 55 
             C170 55, 185 65, 195 80 
             C220 75, 240 95, 245 120 
             C255 150, 245 190, 220 215 
             C195 235, 165 240, 150 240 
             C135 240, 105 235, 80 215 
             C55 190, 45 150, 55 120 
             C60 95, 80 75, 105 80 
             C115 65, 130 55, 150 55 Z" fill="#ffffff"/>
             
    <!-- Внутренняя серая обводка -->
    <path d="M150 59 
             C168 59, 182 68, 191 82 
             C215 77, 234 97, 239 120 
             C248 148, 238 184, 215 207 
             C192 227, 164 232, 150 232 
             C136 232, 108 227, 85 207 
             C62 184, 52 148, 61 120 
             C66 97, 85 77, 109 82 
             C118 68, 132 59, 150 59 Z" fill="#eaeaea"/>

    <!-- Нижний ярус (3 этаж) -->
    <path d="M150 145 
             C195 145, 230 165, 220 200 
             C210 225, 180 230, 150 230 
             C120 230, 90 225, 80 200 
             C70 165, 105 145, 150 145 Z" fill="url(#bg-poop-d3)"/>

    <!-- Средний ярус (2 этаж) -->
    <path d="M150 100 
             C185 100, 210 120, 200 155 
             C190 180, 165 185, 150 185 
             C135 185, 110 180, 100 155 
             C90 120, 115 100, 150 100 Z" fill="#925c34"/>

    <!-- Верхний завиток (1 этаж) -->
    <path d="M150 65 
             C172 65, 185 80, 178 108 
             C170 130, 158 140, 150 140 
             C142 140, 130 130, 122 108 
             C115 80, 128 65, 150 65 Z" fill="#ab6e41"/>

    <!-- Глянцевый блик сверху -->
    <path d="M150 65 C165 65, 178 75, 182 90 C165 80, 140 85, 125 100 C120 85, 132 68, 150 65 Z" fill="url(#highlight-d3)"/>

    <!-- Лицо: День 3 с точно такими аниме-глазками, как на референсе -->
    <!-- Глаза (большой черный овальный зрачок) -->
    <ellipse cx="128" cy="144" rx="8" ry="10" fill="#1c0a02"/>
    <ellipse cx="172" cy="144" rx="8" ry="10" fill="#1c0a02"/>
    
    <!-- Большой верхний белый блик -->
    <ellipse cx="125.5" cy="140" rx="3" ry="4.5" fill="#ffffff"/>
    <ellipse cx="169.5" cy="140" rx="3" ry="4.5" fill="#ffffff"/>

    <!-- Маленький нижний белый блик -->
    <circle cx="131" cy="151" r="2" fill="#ffffff"/>
    <circle cx="175" cy="151" r="2" fill="#ffffff"/>

    <!-- Доброжелательные изогнутые брови -->
    <path d="M120 131 Q128 126 136 131" fill="none" stroke="#1c0a02" stroke-width="3" stroke-linecap="round"/>
    <path d="M180 131 Q172 126 164 131" fill="none" stroke="#1c0a02" stroke-width="3" stroke-linecap="round"/>

    <!-- Довольная улыбка -->
    <path d="M138 165 Q150 173 162 165" fill="none" stroke="#1c0a02" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Легкий румянец -->
    <ellipse cx="116" cy="154" rx="5" ry="2.5" fill="#ff7b7b" opacity="0.35"/>
    <ellipse cx="184" cy="154" rx="5" ry="2.5" fill="#ff7b7b" opacity="0.35"/>
  </g>
</svg>
